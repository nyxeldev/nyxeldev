<svg xmlns="http://www.w3.org/2000/svg" width="940" height="210" viewBox="0 0 940 210" role="img" aria-label="seasmp architecture: nginx in front of a Next.js web client, a Fastify TypeScript API and a Python FastAPI analytics service, backed by PostgreSQL and Redis">
  <style>
    .b { animation: appear .55s ease backwards; }
    .w { animation: draw 1s cubic-bezier(.4,0,.2,1) backwards; }
    .f { stroke: #7c3aed; stroke-width: 1.4; opacity: .5;
          animation: flow linear infinite; }
    @keyframes appear { from { opacity: 0 } to { opacity: 1 } }
    @keyframes draw   { from { stroke-dashoffset: var(--len) } to { stroke-dashoffset: 0 } }
    @keyframes flow   { from { stroke-dashoffset: var(--travel) } to { stroke-dashoffset: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .b, .w { animation: none }
      .f { display: none }
    }
  </style>
