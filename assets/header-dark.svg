    @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .42 } }
    @media (prefers-reduced-motion: reduce) {
      .ch, .sub, .rule, .d, .lit { animation: none; stroke-dashoffset: 0 }
    }
